# Hooks are installed by `pnpm exec lefthook install`, which the prepare script runs.
commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{ts,tsx,js,jsx,json}'
      # Biome ignores these (biome.json) and exits 1 when every staged file is ignored.
      exclude: ['assets/**', 'drizzle/**', 'claudedocs/**']
      # Biome formats only; ESLint owns the React Native and React Compiler rules.
      run: pnpm exec biome format --write {staged_files}
      stage_fixed: true
    typecheck:
      run: pnpm exec tsc --noEmit
